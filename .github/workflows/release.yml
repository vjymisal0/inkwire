name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write # npm provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter inkwire build

      # Opens a "Version Packages" PR; when that PR is merged, publishes to npm.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror whatever version is on npm to GitHub Packages under the owner's scope.
      # Checks the registry itself rather than trusting the changesets "published" output.
      - name: Mirror to GitHub Packages
        working-directory: packages/inkwire
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          npm view "inkwire@$VERSION" version >/dev/null 2>&1 || { echo "inkwire@$VERSION not on npm yet, skipping"; exit 0; }
          echo "@vjymisal0:registry=https://npm.pkg.github.com" > .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          if npm view "@vjymisal0/inkwire@$VERSION" version >/dev/null 2>&1; then
            echo "@vjymisal0/inkwire@$VERSION already mirrored"; exit 0
          fi
          npm pkg set name=@vjymisal0/inkwire
          npm pkg delete publishConfig.provenance
          npm publish --registry https://npm.pkg.github.com
