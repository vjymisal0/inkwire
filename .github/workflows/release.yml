name: Release
on:
  push:
    branches: [main]
concurrency: release
permissions:
  contents: write
  pull-requests: write
  packages: write
  id-token: write # npm provenance
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm, registry-url: "https://registry.npmjs.org" }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter inkwire build

      # Opens a "Version Packages" PR; when that PR is merged, publishes to npm.
      - id: changesets
        uses: changesets/action@v1
        with:
          publish: pnpm changeset publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Mirror the same version to GitHub Packages under the owner's scope.
      - if: steps.changesets.outputs.published == 'true'
        working-directory: packages/inkwire
        run: |
          npm pkg set name=@vjymisal0/inkwire
          npm pkg delete publishConfig.provenance
          echo "//npm.pkg.github.com/:_authToken=${{ secrets.GITHUB_TOKEN }}" > .npmrc
          npm publish --registry https://npm.pkg.github.com
